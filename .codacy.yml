---
# Codacy configuration.
#
# SQLint is an ANSI-SQL parser. Every SQL file in this repository is
# PostgreSQL: numbered migrations use PL/pgSQL (`DO $$ ... BEGIN ... EXCEPTION
# ... END $$;`), and the Fresh DB acceptance suites additionally use psql
# meta-commands (`\set ON_ERROR_STOP on`). SQLint cannot parse either, so it
# reports the language itself as a "syntax error" — seven High/Compatibility
# findings on scripts/ci/fresh-db/acceptance_167_voucher_allocation_hardening.sql
# alone, at exactly the `\set` line and the boundaries of the PL/pgSQL helper.
#
# These are not defects: the same files are parsed and executed by PostgreSQL 17
# in CI on every pull request (the Fresh DB chain, the pglast migration syntax
# gate, and each acceptance workflow), which is a stricter and authoritative
# check of the dialect actually deployed. Keeping the wrong parser enabled
# produces a permanently red quality signal that hides real findings.
#
# Only SQLint is disabled. Every other Codacy tool — including the shell,
# TypeScript and security analyzers — stays active on all paths.
engines:
  sqlint:
    enabled: false
