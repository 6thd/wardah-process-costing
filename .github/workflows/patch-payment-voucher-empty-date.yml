name: Apply payment voucher empty-date hotfix

on:
  push:
    branches:
      - fix/payment-voucher-empty-date

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-voucher-empty-date
          fetch-depth: 0

      - name: Patch optional date payloads
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/services/payment-vouchers-service.ts')
          text = path.read_text()

          replacements = {
              'check_date: receipt.check_date,': 'check_date: receipt.check_date || null,',
              'check_date: payment.check_date,': 'check_date: payment.check_date || null,',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          path.write_text(text)

          test_path = Path('src/services/payment-vouchers-empty-date-contract.test.ts')
          test_path.write_text("""import { describe, expect, it } from 'vitest'\nimport { readFileSync } from 'node:fs'\n\ndescribe('payment voucher optional date contract', () => {\n  it('normalizes empty check dates before database inserts', () => {\n    const source = readFileSync('src/services/payment-vouchers-service.ts', 'utf8')\n    expect(source).toContain('check_date: receipt.check_date || null')\n    expect(source).toContain('check_date: payment.check_date || null')\n    expect(source).not.toContain('check_date: receipt.check_date,')\n    expect(source).not.toContain('check_date: payment.check_date,')\n  })\n})\n""")
          PY

      - name: Verify patch
        run: |
          git diff --check
          grep -F "check_date: receipt.check_date || null" src/services/payment-vouchers-service.ts
          grep -F "check_date: payment.check_date || null" src/services/payment-vouchers-service.ts

      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/patch-payment-voucher-empty-date.yml
          git config user.name wardah-ci
          git config user.email wardah-ci@users.noreply.github.com
          git add src/services/payment-vouchers-service.ts src/services/payment-vouchers-empty-date-contract.test.ts
          git commit -m "fix(finance): normalize optional voucher dates"
          git push origin HEAD:fix/payment-voucher-empty-date
