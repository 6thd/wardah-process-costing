name: Apply Atomic Voucher Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/dev/harden_atomic_voucher_patch.py
      - .github/workflows/apply-atomic-voucher-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/payment-vouchers-legal-gl-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-vouchers-legal-gl-contract
          fetch-depth: 0
      - run: python3 scripts/dev/harden_atomic_voucher_patch.py
      - run: |
          rm -f scripts/dev/harden_atomic_voucher_patch.py
          rm -f .github/workflows/apply-atomic-voucher-hardening.yml
      - run: |
          set -Eeuo pipefail
          git config user.name "wardah-ci"
          git config user.email "wardah-ci@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No hardening changes'; exit 1; }
          git commit -m "fix(finance): harden atomic voucher idempotency"
          git push origin HEAD:fix/payment-vouchers-legal-gl-contract
