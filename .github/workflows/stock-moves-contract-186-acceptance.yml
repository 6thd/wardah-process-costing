name: Stock Moves Contract 186 Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'sql/migrations/186_stock_moves_contract_repair.sql'
      - 'scripts/ci/fresh-db/acceptance_186_stock_moves_contract.sql'
      - 'scripts/ci/fresh-db/acceptance_186_stock_moves_contract_red.sql'
      - 'scripts/ci/fresh-db/acceptance_186_reservation_concurrency.sh'
      - 'scripts/ci/fresh-db/acceptance_195_legacy_mo_quarantine.sql'
      - 'scripts/ci/fresh-db/test_195_legacy_mo_quarantine_column_grants.sh'
      - '.github/workflows/stock-moves-contract-186-acceptance.yml'
      - 'sql/baseline/**'
      - 'sql/migrations/**'
  workflow_dispatch:

jobs:
  acceptance:
    name: M194 legacy contracts and M195–198 quarantine
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve green and pre-186 chains
        shell: bash
        run: |
          set -Eeuo pipefail
          PAIR=$(bash scripts/ci/fresh-db/resolve_baseline_pair.sh sql/baseline 195)
          pair_field() { printf '%s\n' "$PAIR" | sed -n "s/^$1=//p"; }
          echo "BASELINE=$(pair_field BASELINE_PATH)" >> "$GITHUB_ENV"
          echo "REFERENCE=$(pair_field REFERENCE_PATH)" >> "$GITHUB_ENV"
          CUTOFF=$(pair_field BASELINE_CUTOFF)
          CUTOFF=${CUTOFF:-0}
          # M195 intentionally quarantines this legacy client-callable MO RPC.
          # Preserve its M186/M191 oracle through M194; canonical 195–198 CI
          # separately proves the denial and reviewed replacement contracts.
          test "$CUTOFF" -lt 195
          python3 scripts/ci/fresh-db/build_apply_order.py sql/migrations "$CUTOFF" \
            > /tmp/stock-186-full-order.txt
          awk -F_ '$1 < 195' /tmp/stock-186-full-order.txt > /tmp/chain_order.txt
          echo "STOCK_186_LEGACY_CONTRACT_SCOPE_MAX=194; post-quarantine acceptance is material-issue-canonical"

          RED_PAIR=$(bash scripts/ci/fresh-db/resolve_baseline_pair.sh sql/baseline 186)
          red_pair_field() { printf '%s\n' "$RED_PAIR" | sed -n "s/^$1=//p"; }
          echo "RED_BASELINE=$(red_pair_field BASELINE_PATH)" >> "$GITHUB_ENV"
          echo "RED_REFERENCE=$(red_pair_field REFERENCE_PATH)" >> "$GITHUB_ENV"
          RED_CUTOFF=$(red_pair_field BASELINE_CUTOFF)
          RED_CUTOFF=${RED_CUTOFF:-0}
          python3 scripts/ci/fresh-db/build_apply_order.py sql/migrations "$RED_CUTOFF" \
            > /tmp/red_chain_order_full.txt
          grep -q '^186_stock_moves_contract_repair.sql$' /tmp/red_chain_order_full.txt
          sed '/^186_stock_moves_contract_repair.sql$/,$d' \
            /tmp/red_chain_order_full.txt > /tmp/red_order.txt

      - name: Build fresh green database
        shell: bash
        run: |
          set -Eeuo pipefail
          createdb wardah_fresh
          psql -v ON_ERROR_STOP=1 -d wardah_fresh -f scripts/ci/fresh-db/supabase_shim.sql -q
          psql -v ON_ERROR_STOP=1 -d wardah_fresh -f "$BASELINE" -q
          psql -v ON_ERROR_STOP=1 -d wardah_fresh -f "$REFERENCE" -q
          REPORT=/tmp/chain_report.txt PGDATABASE=wardah_fresh \
            bash scripts/ci/fresh-db/run_chain.sh sql/migrations /tmp/chain_order.txt

      - name: Green acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -v ON_ERROR_STOP=1 -d wardah_fresh \
            -f scripts/ci/fresh-db/acceptance_186_stock_moves_contract.sql \
            2>&1 | tee /tmp/stock-186-green.out
          grep -q 'STOCK_186_GREEN_ACCEPTANCE_PASS' /tmp/stock-186-green.out

      - name: Deterministic concurrent reservation proof
        shell: bash
        run: |
          set -Eeuo pipefail
          PGDATABASE=wardah_fresh \
            bash scripts/ci/fresh-db/acceptance_186_reservation_concurrency.sh \
            2>&1 | tee /tmp/stock-186-concurrency.out
          grep -q 'STOCK_186_RESERVATION_CONCURRENCY_PASS' /tmp/stock-186-concurrency.out

      - name: Verify the final quarantined legacy contract
        shell: bash
        run: |
          set -Eeuo pipefail
          # Apply every migration from 195 on, not only 195–198, so the
          # quarantine and the invariants below keep covering later migrations.
          awk -F_ '$1 >= 195' /tmp/stock-186-full-order.txt > /tmp/quarantine-order.txt
          test "$(head -n 4 /tmp/quarantine-order.txt | cut -d_ -f1 | paste -sd,)" = 195,196,197,198
          echo "STOCK_186_FINAL_CHAIN=$(cut -d_ -f1 /tmp/quarantine-order.txt | paste -sd,)"
          REPORT=/tmp/stock-186-quarantine-chain.txt PGDATABASE=wardah_fresh \
            bash scripts/ci/fresh-db/run_chain.sh sql/migrations /tmp/quarantine-order.txt
          psql -v ON_ERROR_STOP=1 -d wardah_fresh \
            -f scripts/ci/fresh-db/acceptance_195_legacy_mo_quarantine.sql \
            2>&1 | tee /tmp/stock-186-quarantine.out
          grep -q 'M195_198_LEGACY_MO_QUARANTINE_PASS' /tmp/stock-186-quarantine.out
          PGDATABASE=wardah_fresh \
            bash scripts/ci/fresh-db/test_195_legacy_mo_quarantine_column_grants.sh \
            2>&1 | tee /tmp/stock-186-quarantine-column-controls.out
          grep -q 'QUARANTINE_COLUMN_GRANT_CONTROLS_PASS controls=9' /tmp/stock-186-quarantine-column-controls.out

      - name: Re-prove M186 invariants on the final chain
        shell: bash
        run: |
          set -Eeuo pipefail
          # Only the reservation block calls the quarantined legacy RPC. Every
          # other GREEN assertion (no stock_moves routine, compatibility ACL,
          # balance mismatch/match, wrapper) must still hold after 195+.
          SRC=scripts/ci/fresh-db/acceptance_186_stock_moves_contract.sql
          OUT=/tmp/stock-186-final-chain.sql
          test "$(grep -c '^DO \$reservation_contract\$$' "$SRC")" = 1
          test "$(grep -c '^\$reservation_contract\$;$' "$SRC")" = 1
          awk '/^DO \$reservation_contract\$$/ { skip = 1 }
               !skip { print }
               /^\$reservation_contract\$;$/ { skip = 0 }' "$SRC" > "$OUT"
          test "$(grep -c 'rpc_create_mo_with_reservation' "$OUT")" = 0
          psql -v ON_ERROR_STOP=1 -d wardah_fresh -f "$OUT" \
            2>&1 | tee /tmp/stock-186-final-chain.out
          for marker in CONTRACT_SHAPE_OK BALANCE_MISMATCH_OK BALANCE_MATCH_OK \
                        COMPATIBILITY_WRAPPER_OK ACCEPTANCE_PASS; do
            grep -q "STOCK_186_GREEN_$marker" /tmp/stock-186-final-chain.out
          done
          if grep -q 'STOCK_186_GREEN_RESERVATION_CONTRACT_OK' /tmp/stock-186-final-chain.out; then
            echo 'reservation block was expected to be excluded' >&2
            exit 1
          fi

      - name: Build pre-186 red database
        shell: bash
        run: |
          set -Eeuo pipefail
          createdb wardah_red
          psql -v ON_ERROR_STOP=1 -d wardah_red -f scripts/ci/fresh-db/supabase_shim.sql -q
          psql -v ON_ERROR_STOP=1 -d wardah_red -f "$RED_BASELINE" -q
          psql -v ON_ERROR_STOP=1 -d wardah_red -f "$RED_REFERENCE" -q
          REPORT=/tmp/red_chain_report.txt PGDATABASE=wardah_red \
            bash scripts/ci/fresh-db/run_chain.sh sql/migrations /tmp/red_order.txt

          psql -v ON_ERROR_STOP=1 -d wardah_red \
            -f scripts/ci/fresh-db/acceptance_186_stock_moves_contract_red.sql \
            2>&1 | tee /tmp/stock-186-red.out
          grep -q 'STOCK_186_RED_PROOF_PASS' /tmp/stock-186-red.out

      - name: Confirm every proof direction ran
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'STOCK_186_GREEN_CONTRACT_SHAPE_OK' /tmp/stock-186-green.out
          grep -q 'STOCK_186_GREEN_BALANCE_MISMATCH_OK' /tmp/stock-186-green.out
          grep -q 'STOCK_186_GREEN_RESERVATION_CONTRACT_OK' /tmp/stock-186-green.out
          grep -q 'STOCK_186_GREEN_OUTFLOW_RESERVATION_FLOOR_OK' /tmp/stock-186-green.out
          grep -q 'STOCK_186_GREEN_ACCEPTANCE_PASS' /tmp/stock-186-green.out
          grep -q 'STOCK_186_RESERVATION_CONCURRENCY_PASS' /tmp/stock-186-concurrency.out
          grep -q 'M195_198_LEGACY_MO_QUARANTINE_PASS' /tmp/stock-186-quarantine.out
          grep -q 'STOCK_186_GREEN_CONTRACT_SHAPE_OK' /tmp/stock-186-final-chain.out
          grep -q 'STOCK_186_GREEN_ACCEPTANCE_PASS' /tmp/stock-186-final-chain.out
          grep -q 'STOCK_186_RED_BALANCE_42P01_OK' /tmp/stock-186-red.out
          grep -q 'STOCK_186_RED_RESERVATION_42P01_OK' /tmp/stock-186-red.out
          grep -q 'STOCK_186_RED_LEGACY_CONSUMPTION_MASKED_ERROR_OK' /tmp/stock-186-red.out
          grep -q 'STOCK_186_RED_VARIANCE_FALSE_EMPTY_OK' /tmp/stock-186-red.out
          grep -q 'STOCK_186_RED_PROOF_PASS' /tmp/stock-186-red.out

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-moves-contract-186-${{ github.run_id }}
          path: |
            /tmp/chain_report.txt
            /tmp/red_chain_report.txt
            /tmp/stock-186-green.out
            /tmp/stock-186-concurrency.out
            /tmp/stock-186-red.out
            /tmp/stock-186-*.out
            /tmp/stock-186-*.err
          retention-days: 30
