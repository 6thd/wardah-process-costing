name: Phase 3 Stock Adjustment Save Refactor

on:
  push:
    branches:
      - agent/stock-adjustments-save-refactor-phase3

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact Phase 3 base
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE="6ffcfc44859330561c12261e1ae7f896e2867f4f"
          ACTUAL_BASE="$(git rev-parse HEAD^)"
          test "$ACTUAL_BASE" = "$EXPECTED_BASE"
          test "$(git branch --show-current)" = "agent/stock-adjustments-save-refactor-phase3"
          echo "Guarded base confirmed: $ACTUAL_BASE"

      - name: Apply behavior-preserving save extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('src/features/inventory/index.tsx')
          helpers_index_path = Path('src/features/inventory/helpers/index.ts')
          save_helper_path = Path('src/features/inventory/helpers/stockAdjustmentSave.ts')

          index_text = index_path.read_text(encoding='utf-8')
          helpers_index = helpers_index_path.read_text(encoding='utf-8')

          old_import = """  findUnmappedAdjustmentProductIds,\n  updateAdjustmentItemQuantity,\n"""
          new_import = """  findUnmappedAdjustmentProductIds,\n  saveStockAdjustmentDraft,\n  updateAdjustmentItemQuantity,\n"""
          if index_text.count(old_import) != 1:
              raise SystemExit('Guard failed: helper import anchor changed')
          index_text = index_text.replace(old_import, new_import, 1)

          start_marker = "  const handleSaveAdjustment = async () => {"
          end_marker = "\n  const handleSubmitAdjustment = async (adjustmentId: string) => {"
          if index_text.count(start_marker) != 1 or index_text.count(end_marker) != 1:
              raise SystemExit('Guard failed: StockAdjustments save/submit anchors changed')
          start = index_text.index(start_marker)
          end = index_text.index(end_marker, start)
          old_save = index_text[start:end]
          required_contract_fragments = [
              "const isEditingGuard = selectedAdjustment?.isEditing",
              "validateAdjustmentForm(newAdjustment as AdjustmentFormState)",
              "productUomStatus.isEnabled && !productUomStatus.isSuccess",
              "findUnmappedAdjustmentProductIds(newAdjustment.items, productNeedsUomSetup)",
              "await supabase.auth.getUser()",
              "if (!currentOrgId)",
              ".from('stock_adjustments')",
              ".from('stock_adjustment_items')",
              ".delete()",
              "toast.success(isEditing ? 'تم تحديث التسوية بنجاح' : 'تم حفظ التسوية كمسودة بنجاح')",
              "loadAdjustments()",
          ]
          missing = [fragment for fragment in required_contract_fragments if fragment not in old_save]
          if missing:
              raise SystemExit(f'Guard failed: save contract fragment(s) missing: {missing}')

          new_save = """  const handleSaveAdjustment = async () => {
            const isEditingGuard = selectedAdjustment?.isEditing
            if (isEditingGuard ? !canUpdateAdjustment : !canCreateAdjustment) {
              toast.error(isEditingGuard ? 'لا تملك صلاحية تعديل تسويات المخزون' : 'لا تملك صلاحية إنشاء تسويات مخزون')
              return
            }
            // Use imported validation from helpers
            const validation = validateAdjustmentForm(newAdjustment as AdjustmentFormState)
            if (!validation.valid) {
              toast.error(validation.message)
              return
            }

            // Re-check UoM setup fail-closed: a draft may carry a product selected during a
            // status-load race, or one left unmapped. Block before any DB write.
            if (productUomStatus.isEnabled && !productUomStatus.isSuccess) {
              toast.error('جارٍ التحقق من إعداد وحدات الأصناف — أعد المحاولة بعد لحظات')
              return
            }
            if (findUnmappedAdjustmentProductIds(newAdjustment.items, productNeedsUomSetup).length > 0) {
              toast.error('لا يمكن الحفظ: توجد أصناف تحتاج إعداد وحدة قبل استخدامها في التسوية')
              return
            }

            try {
              const supabase = getSupabase()

              // Keep auth and org checks in the component so their ordering remains unchanged.
              const { data: { user } } = await supabase.auth.getUser()
              if (!user) {
                toast.error('الرجاء تسجيل الدخول')
                return
              }

              if (!currentOrgId) {
                toast.error('لم يتم تحديد المؤسسة النشطة')
                return
              }

              const { isEditing } = await saveStockAdjustmentDraft({
                supabase,
                form: newAdjustment as AdjustmentFormState,
                orgId: currentOrgId,
                userId: user.id,
                selectedAdjustment,
              })

              toast.success(isEditing ? 'تم تحديث التسوية بنجاح' : 'تم حفظ التسوية كمسودة بنجاح')
              setShowNewForm(false)
              setSelectedAdjustment(null)
              setNewAdjustment({
                adjustment_date: new Date().toISOString().split('T')[0],
                adjustment_type: 'PHYSICAL_COUNT',
                reason: '',
                reference_number: '',
                warehouse_id: warehouses[0]?.id || '',
                increase_account_id: '',
                decrease_account_id: '',
                items: []
              })

              // Reload adjustments
              loadAdjustments()
            } catch (error: any) {
              console.error('Error saving adjustment:', error)
              toast.error(error.message || 'خطأ في حفظ التسوية')
            }
          }
          """
          index_text = index_text[:start] + new_save + index_text[end:]
          index_path.write_text(index_text, encoding='utf-8')

          export_line = "export * from './stockAdjustmentSave';"
          if export_line in helpers_index:
              raise SystemExit('Guard failed: stockAdjustmentSave helper already exported')
          if "export * from './stockAdjustmentHelpers';" not in helpers_index:
              raise SystemExit('Guard failed: inventory helpers index anchor changed')
          helpers_index = helpers_index.rstrip() + "\n" + export_line + "\n"
          helpers_index_path.write_text(helpers_index, encoding='utf-8')

          if save_helper_path.exists():
              raise SystemExit('Guard failed: stockAdjustmentSave.ts already exists')

          save_helper_path.write_text("""import type { SupabaseClient } from '@supabase/supabase-js'
          import type { Database } from '@/lib/supabase'
          import {
            calculateAdjustmentTotals,
            type AdjustmentFormState,
          } from './stockAdjustmentHelpers'

          type SelectedAdjustmentForSave = {
            id: string
            isEditing?: boolean
          } | null | undefined

          interface SaveStockAdjustmentDraftParams {
            supabase: SupabaseClient<Database>
            form: AdjustmentFormState
            orgId: string
            userId: string
            selectedAdjustment: SelectedAdjustmentForSave
          }

          type AdjustmentTotals = ReturnType<typeof calculateAdjustmentTotals>

          function throwIfSupabaseError(error: unknown): void {
            if (error) throw error
          }

          async function updateExistingAdjustment(
            supabase: SupabaseClient<Database>,
            form: AdjustmentFormState,
            totals: AdjustmentTotals,
            orgId: string,
            adjustmentId: string,
          ) {
            const { data: updatedAdjustment, error: updateError } = await supabase
              .from('stock_adjustments')
              .update({
                adjustment_date: form.adjustment_date,
                posting_date: form.adjustment_date,
                adjustment_type: form.adjustment_type,
                reason: form.reason,
                reference_number: form.reference_number || null,
                warehouse_id: form.warehouse_id,
                increase_account_id: form.increase_account_id,
                decrease_account_id: form.decrease_account_id,
                total_items: totals.totalItems,
                total_qty_difference: totals.totalQtyDiff,
                total_value_difference: totals.totalValueDiff,
                updated_at: new Date().toISOString(),
              })
              .eq('id', adjustmentId)
              .eq('organization_id', orgId)
              .select()
              .single()

            throwIfSupabaseError(updateError)

            const { error: deleteError } = await supabase
              .from('stock_adjustment_items')
              .delete()
              .eq('adjustment_id', adjustmentId)
              .eq('organization_id', orgId)

            throwIfSupabaseError(deleteError)
            return updatedAdjustment!
          }

          async function createAdjustment(
            supabase: SupabaseClient<Database>,
            form: AdjustmentFormState,
            totals: AdjustmentTotals,
            orgId: string,
            userId: string,
          ) {
            const { data: newAdjustment, error: adjustmentError } = await supabase
              .from('stock_adjustments')
              .insert({
                organization_id: orgId,
                adjustment_date: form.adjustment_date,
                adjustment_number: `ADJ-${Date.now()}`,
                posting_date: form.adjustment_date,
                adjustment_type: form.adjustment_type,
                reason: form.reason,
                reference_number: form.reference_number || null,
                warehouse_id: form.warehouse_id,
                increase_account_id: form.increase_account_id,
                decrease_account_id: form.decrease_account_id,
                status: 'DRAFT',
                total_items: totals.totalItems,
                total_qty_difference: totals.totalQtyDiff,
                total_value_difference: totals.totalValueDiff,
                created_by: userId,
              })
              .select()
              .single()

            throwIfSupabaseError(adjustmentError)
            return newAdjustment!
          }

          async function insertAdjustmentItems(
            supabase: SupabaseClient<Database>,
            form: AdjustmentFormState,
            orgId: string,
            adjustmentId: string,
          ): Promise<void> {
            const itemsToInsert = form.items.map((item) => ({
              adjustment_id: adjustmentId,
              organization_id: orgId,
              product_id: item.product_id,
              warehouse_id: item.warehouse_id || form.warehouse_id,
              current_qty: item.current_qty,
              new_qty: item.new_qty,
              difference_qty: item.difference_qty,
              current_rate: item.current_rate,
              value_difference: item.value_difference,
              reason: item.reason || null,
            }))

            const { error: itemsError } = await supabase
              .from('stock_adjustment_items')
              .insert(itemsToInsert)

            throwIfSupabaseError(itemsError)
          }

          export async function saveStockAdjustmentDraft({
            supabase,
            form,
            orgId,
            userId,
            selectedAdjustment,
          }: SaveStockAdjustmentDraftParams): Promise<{ isEditing: boolean }> {
            const totals = calculateAdjustmentTotals(form.items)
            const isEditing = Boolean(selectedAdjustment?.isEditing)
            const adjustment = selectedAdjustment?.isEditing
              ? await updateExistingAdjustment(
                  supabase,
                  form,
                  totals,
                  orgId,
                  selectedAdjustment.id,
                )
              : await createAdjustment(supabase, form, totals, orgId, userId)

            await insertAdjustmentItems(supabase, form, orgId, adjustment.id)
            return { isEditing }
          }
          """, encoding='utf-8')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Focused behavior lock
        run: npm run test -- --run src/features/inventory/__tests__/stock-adjustments-behavior-lock.test.tsx --coverage.enabled=false

      - name: TypeScript type check
        run: npm run type-check

      - name: RBAC direct-write boundary
        run: node scripts/ci/check-rbac-direct-writes.mjs

      - name: ESLint
        run: npm run lint

      - name: Full Vitest suite
        run: npm run test -- --run --coverage.enabled=false

      - name: Production build
        run: npm run build

      - name: Diff integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'src/features/inventory/index.tsx',
              'src/features/inventory/helpers/index.ts',
              'src/features/inventory/helpers/stockAdjustmentSave.ts',
          }
          changed = set(subprocess.check_output(
              ['git', 'status', '--short'], text=True
          ).splitlines())
          paths = {line[3:] for line in changed if len(line) >= 4 and not line[3:].startswith('.github/workflows/')}
          if paths != expected:
              raise SystemExit(f'Unexpected Phase 3 paths: {sorted(paths)}')
          print('Phase 3 changed paths verified:', sorted(paths))
          PY

      - name: Commit verified refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/inventory/index.tsx \
                  src/features/inventory/helpers/index.ts \
                  src/features/inventory/helpers/stockAdjustmentSave.ts
          git commit -m "refactor(inventory): extract adjustment draft persistence"
          git push origin HEAD:agent/stock-adjustments-save-refactor-phase3
