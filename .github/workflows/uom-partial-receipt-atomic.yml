name: UoM Partial Receipt Atomic Acceptance

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'sql/migrations/148_uom_purchase_receipt_snapshots.sql'
      - 'scripts/ci/fresh-db/acceptance_148_uom_partial_receipts.sql'
      - 'src/components/forms/GoodsReceiptForm.tsx'
      - 'src/components/forms/UomGoodsReceiptForm.tsx'
      - 'src/features/purchasing/index.tsx'
      - 'src/services/uom-goods-receipt-service.ts'
      - 'src/services/purchasing-service.ts'
      - 'src/components/forms/__tests__/goods-receipt-legacy-contract.test.tsx'
      - 'src/features/purchasing/__tests__/goods-receipt-rollout-gate.test.tsx'
      - 'src/services/__tests__/uom-goods-receipt-service.test.ts'
      - 'src/services/__tests__/goods-receipt-atomic.test.ts'
      - 'src/types/database.generated.ts'
      - '.github/workflows/uom-partial-receipt-atomic.yml'
      - 'scripts/ci/fresh-db/resolve_baseline_pair.sh'
      - 'sql/baseline/**'
  workflow_dispatch:

jobs:
  acceptance:
    name: Migration 148 Quality-Aware Partial Receipt
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build fresh database through migration 148
        run: |
          set -Eeuo pipefail
          set +e
          PAIR=$(bash scripts/ci/fresh-db/resolve_baseline_pair.sh sql/baseline)
          PAIR_STATUS=$?
          set -e
          test "$PAIR_STATUS" -eq 0
          pair_field() { printf '%s\n' "$PAIR" | sed -n "s/^$1=//p"; }
          BASELINE=$(pair_field BASELINE_PATH)
          REFERENCE=$(pair_field REFERENCE_PATH)
          CUTOFF=$(pair_field BASELINE_CUTOFF)
          CUTOFF=${CUTOFF:-0}

          createdb wardah_fresh
          psql -v ON_ERROR_STOP=1 -d wardah_fresh \
            -f scripts/ci/fresh-db/supabase_shim.sql -q
          psql -v ON_ERROR_STOP=1 -d wardah_fresh -f "$BASELINE" -q
          psql -v ON_ERROR_STOP=1 -d wardah_fresh -f "$REFERENCE" -q

          python3 scripts/ci/fresh-db/build_apply_order.py \
            sql/migrations "$CUTOFF" > /tmp/chain_order.txt
          REPORT=/tmp/chain_report.txt PGDATABASE=wardah_fresh \
            bash scripts/ci/fresh-db/run_chain.sh sql/migrations /tmp/chain_order.txt

          psql -v ON_ERROR_STOP=1 -d wardah_fresh -tAc \
            "SELECT to_regprocedure('public.rpc_submit_purchase_order(uuid,uuid)') IS NOT NULL
                    AND to_regprocedure('public.rpc_approve_purchase_order(uuid,uuid)') IS NOT NULL
                    AND to_regprocedure('public.rpc_list_uom_receivable_purchase_orders(uuid)') IS NOT NULL
                    AND to_regprocedure('public.rpc_post_goods_receipt(jsonb)') IS NOT NULL" \
            | grep -qx t
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Verify the additive quality-quantity contract landed
        run: |
          set -Eeuo pipefail
          psql -v ON_ERROR_STOP=1 -d wardah_fresh -tAc \
            "SELECT count(*) FROM information_schema.columns
              WHERE table_schema='public' AND table_name='purchase_order_lines'
                AND column_name IN ('accepted_quantity','rejected_quantity')" \
            | grep -qx 2
          psql -v ON_ERROR_STOP=1 -d wardah_fresh -tAc \
            "SELECT count(*) FROM pg_constraint
              WHERE conrelid='public.purchase_order_lines'::regclass
                AND conname='purchase_order_lines_quality_quantity_check'" \
            | grep -qx 1
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Prove approval gate, snapshot receiving, and quality-aware closure
        run: >-
          psql -v ON_ERROR_STOP=1 -d wardah_fresh
          -f scripts/ci/fresh-db/acceptance_148_uom_partial_receipts.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove the rollout flag never breaks the legacy receipt path
        run: >-
          npm run test -- --run --coverage.enabled=false
          src/features/purchasing/__tests__/goods-receipt-rollout-gate.test.tsx
          src/components/forms/__tests__/goods-receipt-legacy-contract.test.tsx
          src/services/__tests__/uom-goods-receipt-service.test.ts
          src/services/__tests__/goods-receipt-atomic.test.ts
