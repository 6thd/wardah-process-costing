name: Temporary Atomic Voucher Runner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/payment-vouchers-legal-gl-contract' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-vouchers-legal-gl-contract
          fetch-depth: 0
      - name: Execute guarded patch payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/_temp_atomic_voucher_patch.yml').read_text()
          start = source.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(payload, '<atomic-voucher-patch>', 'exec'))
          PY
          rm -f .github/workflows/_temp_atomic_voucher_runner.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(finance): make voucher posting atomic in migration 153"
          git push origin HEAD:fix/payment-vouchers-legal-gl-contract
