name: Material issue canonical allocation
on:
  pull_request:
    branches: [main]
    paths:
      - 'sql/migrations/**'
      - 'docs/db/material-issue-canonical-195-198/**'
      - 'scripts/ci/check_definer_guards.py'
      - 'scripts/ci/test_material_issue_canonical_delegations.py'
      # run_local.sh consumes these directly: shim, baseline resolver, apply
      # order, chain runner, quarantine probe and the anchored Baseline pair.
      - 'scripts/ci/fresh-db/**'
      - 'sql/baseline/**'
      - '.github/workflows/material-issue-canonical.yml'
permissions:
  contents: read
jobs:
  canonical:
    name: Canonical 195–198 on standard PG17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d71a1657739d1660740ac931ef5f48bffbd4476f
          path: reviewed-harness
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable database clients
        shell: bash
        run: |
          set -Eeuo pipefail
          # Pin the PG17 client so CI matches the PG17 server and local evidence;
          # the runner's default postgresql-client is not guaranteed to be 17.
          if [ ! -x /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-common
          fi
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          python -m pip install 'psycopg[binary]==3.3.6'
      - name: Confirm PostgreSQL 17 client
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v psql
          psql --version
          psql --version | grep -Eq '^psql \(PostgreSQL\) 17\.'
      - name: Verify source pins and scanner failure controls
        run: |
          python3 docs/db/material-issue-canonical-195-198/verify_package.py --harness reviewed-harness
          python3 docs/db/material-issue-canonical-195-198/test_package.py
          python3 scripts/ci/test_material_issue_canonical_delegations.py
          python3 scripts/ci/test_check_definer_guards.py
          python3 scripts/ci/check_definer_guards.py
      - name: Install actual canonical files and accept final catalog
        shell: bash
        run: |
          set -Eeuo pipefail
          bash docs/db/material-issue-canonical-195-198/run_local.sh reviewed-harness \
            2>&1 | tee /tmp/material-issue-canonical-195-198.out
          grep -q 'CANONICAL_MATERIAL_ISSUE_PG17_PASS' /tmp/material-issue-canonical-195-198.out
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-issue-canonical-195-198-${{ github.run_id }}
          path: /tmp/material-issue-canonical-195-198.out
          if-no-files-found: warn
          retention-days: 30
