name: Material issue client canonical integration
on:
  pull_request:
    branches: [main, feat/229-material-issue-isolated-ui, feat/170-154-material-issue-maintenance-client, feat/198-material-issue-parent-version-db, feat/198-material-issue-parent-version-client, feat/material-issue-client-promotion-main]
    paths:
      - 'src/**'
      - 'sql/migrations/**'
      - 'sql/baseline/**'
      - 'scripts/ci/fresh-db/**'
      - 'docs/db/material-issue-client-promotion/**'
      - 'docs/db/material-issue-canonical-195-198/**'
      - 'docs/db/material-issue-quality-integration/**'
      - 'docs/db/quality-control-199/**'
      - 'tests/fixtures/material-issue-combined/**'
      - 'tests/fixtures/material-issue-real-auth/**'
      - 'docs/db/material-issue-229/COMBINED_OPERATOR_ACCEPTANCE.md'
      - 'docs/db/material-issue-release/**'
      - 'docs/db/material-issue-parent-version-198/**'
      - 'scripts/ci/check_retryable_raise_sqlstate.py'
      - 'scripts/ci/test_check_retryable_raise_sqlstate.py'
      - '.github/workflows/material-issue-combined-candidate.yml'
permissions:
  contents: read
jobs:
  combined:
    name: Combined client and PG17 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen client and canonical integration boundary
        run: |
          set -Eeuo pipefail
          CLIENT=d71a1657739d1660740ac931ef5f48bffbd4476f
          BASE=3acea30d83e182a2651b60b8696a658137bc0c92
          test "$(git rev-parse "$CLIENT^{tree}")" = ed2f78616e7b3582206bf39e47dcc94539c73c9f
          git merge-base --is-ancestor "$BASE" HEAD
          node docs/db/material-issue-quality-integration/verify_sources.mjs
          HARNESS="$RUNNER_TEMP/wardah-reviewed-material-issue"
          git worktree add --detach "$HARNESS" "$CLIENT"
          echo "HARNESS=$HARNESS" >> "$GITHUB_ENV"
          echo "CLIENT_HEAD=$(git rev-parse HEAD) REVIEWED_CLIENT=$CLIENT CANONICAL_BASE=$BASE TREE=$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable test dependencies
        run: |
          npm ci --ignore-scripts
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          python -m pip install 'psycopg[binary]==3.3.6'
          npx playwright install --with-deps chromium
      - name: Confirm PostgreSQL 17 client
        run: psql --version | grep -Eq '^psql \(PostgreSQL\) 17\.'
      - name: Frozen M196 acceptance and races
        run: (cd "$HARNESS" && bash docs/db/material-issue-maintenance-170-154/run_local.sh)
      - name: Proposed migration package installs before fixtures
        run: (cd "$HARNESS" && bash docs/db/material-issue-release/run_migration_package.sh)
      - name: M198 candidate parent-version acceptance
        run: (cd "$HARNESS" && bash docs/db/material-issue-parent-version-198/run_local.sh)
      - name: Actual canonical SQL acceptance on this head
        run: |
          set -Eeuo pipefail
          bash docs/db/material-issue-canonical-195-198/run_local.sh "$HARNESS" 2>&1 | tee /tmp/material-issue-client-canonical.out
          grep -q 'CANONICAL_MATERIAL_ISSUE_PG17_PASS chain=9 readback=22' /tmp/material-issue-client-canonical.out
      - name: Browser to real disposable PG17 flow
        env:
          WARDAH_PARENT_VERSION_198: 'true'
        run: |
          set -Eeuo pipefail
          bash tests/fixtures/material-issue-combined/run_local.sh 2>&1 | tee /tmp/material-issue-client-browser.out
      - name: Complete M199 prerequisite and quality controls
        run: |
          set -Eeuo pipefail
          bash docs/db/quality-control-199/run_local.sh 2>&1 | tee /tmp/material-issue-quality.out
          grep -Fq 'M199_PREREQUISITE_CONTROLS_PASS prefixes=2 mutations=14 restored=true' /tmp/material-issue-quality.out
          grep -Fq 'GREEN_M199_QUALITY_CONTROL_ACCEPTANCE' /tmp/material-issue-quality.out
      - name: Shared QC hold, material replay and M198 parent-version controls
        run: |
          set -Eeuo pipefail
          bash docs/db/material-issue-quality-integration/run_local.sh 2>&1 | tee /tmp/material-issue-quality-shared.out
          grep -Fq 'QC_MATERIAL_SHARED_PG17_PASS chain=10 readback=22' /tmp/material-issue-quality-shared.out
      - name: Real local vendor Auth and PostgREST browser acceptance
        env:
          WARDAH_PARENT_VERSION_198: 'true'
        run: |
          set -Eeuo pipefail
          bash tests/fixtures/material-issue-real-auth/run_local.sh 2>&1 | tee /tmp/material-issue-client-real-auth.out
      - name: Print disposable service failures
        if: failure()
        run: |
          for path in /tmp/wardah-real-auth-service.txt /tmp/wardah-real-rest-service.txt /tmp/wardah-real-auth-bridge.txt /tmp/wardah-combined-bridge.txt; do
            if test -f "$path"; then tail -60 "$path"; fi
          done
      - name: Upload local adapter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-local-adapter-diagnostics
          path: |
            /tmp/material-issue-client-canonical.out
            /tmp/material-issue-client-browser.out
            /tmp/material-issue-client-real-auth.out
            /tmp/material-issue-quality.out
            /tmp/material-issue-quality-shared.out
            /tmp/wardah-combined-bridge.txt
            /tmp/wardah-combined-vite.txt
            /tmp/wardah-real-auth-bridge.txt
            /tmp/wardah-real-auth-vite.txt
            /tmp/wardah-real-auth-health.json
          if-no-files-found: ignore
