name: Voucher Allocation 167 Acceptance

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'sql/migrations/166_voucher_reset_to_draft_workflow.sql'
      - 'sql/migrations/167_voucher_allocation_lines_hardening.sql'
      - 'scripts/ci/fresh-db/acceptance_167_voucher_allocation_hardening.sql'
      - '.github/workflows/voucher-allocation-167-acceptance.yml'
      - 'scripts/ci/fresh-db/resolve_baseline_pair.sh'
      - 'scripts/ci/fresh-db/build_apply_order.py'
      - 'scripts/ci/fresh-db/run_chain.sh'
      - 'scripts/ci/fresh-db/supabase_shim.sql'
      - 'sql/baseline/**'
  workflow_dispatch:

jobs:
  acceptance:
    name: Migration 167 Allocation Hardening
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build fresh database through migration 167
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          PAIR=$(bash scripts/ci/fresh-db/resolve_baseline_pair.sh sql/baseline)
          PAIR_STATUS=$?
          set -e
          test "$PAIR_STATUS" -eq 0

          pair_field() { printf '%s\n' "$PAIR" | sed -n "s/^$1=//p"; }
          BASELINE=$(pair_field BASELINE_PATH)
          REFERENCE=$(pair_field REFERENCE_PATH)
          CUTOFF=$(pair_field BASELINE_CUTOFF)
          CUTOFF=${CUTOFF:-0}

          createdb wardah_fresh
          psql -v ON_ERROR_STOP=1 -d wardah_fresh \
            -f scripts/ci/fresh-db/supabase_shim.sql -q
          psql -v ON_ERROR_STOP=1 -d wardah_fresh -f "$BASELINE" -q
          psql -v ON_ERROR_STOP=1 -d wardah_fresh -f "$REFERENCE" -q

          python3 scripts/ci/fresh-db/build_apply_order.py \
            sql/migrations "$CUTOFF" > /tmp/chain_order.txt
          REPORT=/tmp/chain_report.txt PGDATABASE=wardah_fresh \
            bash scripts/ci/fresh-db/run_chain.sh sql/migrations /tmp/chain_order.txt

          psql -v ON_ERROR_STOP=1 -d wardah_fresh -tAc \
            "SELECT to_regprocedure('public.wardah_protect_voucher_allocation_lines()') IS NOT NULL
                    AND to_regprocedure('public.rpc_reset_customer_receipt_to_draft(uuid,text)') IS NOT NULL
                    AND to_regprocedure('public.rpc_reset_supplier_payment_to_draft(uuid,text)') IS NOT NULL" \
            | grep -qx t
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Execute allocation hardening acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -v ON_ERROR_STOP=1 -d wardah_fresh \
            -f scripts/ci/fresh-db/acceptance_167_voucher_allocation_hardening.sql \
            | tee /tmp/voucher-allocation-167.out
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      # Independent completion marker: keep this even with pipefail so a future
      # script edit cannot stop early and still present an apparently green run.
      - name: Verify acceptance marker
        run: grep -q 'VOUCHER_ALLOCATION_167_ACCEPTANCE_PASS' /tmp/voucher-allocation-167.out

      - name: Upload allocation hardening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voucher-allocation-167-${{ github.run_id }}
          path: |
            /tmp/voucher-allocation-167.out
            /tmp/chain_order.txt
            /tmp/chain_report.txt
          if-no-files-found: error
          retention-days: 30
