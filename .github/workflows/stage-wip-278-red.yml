name: Stage WIP #278 RED on disposable PG17

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/db/stage-wip-278/**'
      - '.github/workflows/stage-wip-278-red.yml'
      - 'sql/baseline/**'
  workflow_dispatch:

jobs:
  red:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Prove WIP overwrite, re-key and overlap before #278
        run: bash docs/db/stage-wip-278/run_red.sh
