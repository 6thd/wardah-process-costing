name: Voucher Atomic Lifecycle 168 Acceptance

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'sql/migrations/166_voucher_reset_to_draft_workflow.sql'
      - 'sql/migrations/167_voucher_allocation_lines_hardening.sql'
      - 'sql/migrations/168_voucher_atomic_lifecycle_rpcs.sql'
      - 'scripts/ci/fresh-db/acceptance_168_voucher_atomic_lifecycle.sql'
      - 'scripts/ci/fresh-db/acceptance_168_concurrency.sh'
      - 'scripts/ci/fresh-db/acceptance_168_current_tenant_cancel_contract.sql'
      - '.github/workflows/voucher-atomic-168-acceptance.yml'
      - 'scripts/ci/fresh-db/resolve_baseline_pair.sh'
      - 'scripts/ci/fresh-db/build_apply_order.py'
      - 'scripts/ci/fresh-db/run_chain.sh'
      - 'scripts/ci/fresh-db/supabase_shim.sql'
      - 'sql/baseline/**'
  workflow_dispatch:

jobs:
  acceptance:
    name: Migration 168 Atomic Voucher Lifecycle
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build current fresh database
        run: |
          set -Eeuo pipefail
          PAIR=$(bash scripts/ci/fresh-db/resolve_baseline_pair.sh sql/baseline)
          pair_field() { printf '%s\n' "$PAIR" | sed -n "s/^$1=//p"; }
          BASELINE=$(pair_field BASELINE_PATH)
          REFERENCE=$(pair_field REFERENCE_PATH)
          CUTOFF=$(pair_field BASELINE_CUTOFF)
          CUTOFF=${CUTOFF:-0}

          createdb wardah_fresh
          psql -v ON_ERROR_STOP=1 -d wardah_fresh \
            -f scripts/ci/fresh-db/supabase_shim.sql -q
          psql -v ON_ERROR_STOP=1 -d wardah_fresh -f "$BASELINE" -q
          psql -v ON_ERROR_STOP=1 -d wardah_fresh -f "$REFERENCE" -q

          python3 scripts/ci/fresh-db/build_apply_order.py \
            sql/migrations "$CUTOFF" > /tmp/chain_order.txt
          REPORT=/tmp/chain_report.txt PGDATABASE=wardah_fresh \
            bash scripts/ci/fresh-db/run_chain.sh sql/migrations /tmp/chain_order.txt

          psql -v ON_ERROR_STOP=1 -d wardah_fresh -tAc \
            "SELECT to_regprocedure('public.rpc_create_customer_receipt(jsonb)') IS NOT NULL
                    AND to_regprocedure('public.rpc_create_supplier_payment(jsonb)') IS NOT NULL
                    AND to_regprocedure('public.rpc_update_customer_receipt_draft(uuid,jsonb)') IS NOT NULL
                    AND to_regprocedure('public.rpc_update_supplier_payment_draft(uuid,jsonb)') IS NOT NULL
                    AND to_regprocedure('public.rpc_cancel_customer_receipt(uuid,text)') IS NOT NULL
                    AND to_regprocedure('public.rpc_cancel_supplier_payment(uuid,text)') IS NOT NULL
                    AND to_regprocedure('public.wardah_has_exact_permission(uuid,uuid,text)') IS NOT NULL" \
            | grep -qx t
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Verify current permission-first and tenant-cancel contract
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -v ON_ERROR_STOP=1 -d wardah_fresh \
            -f scripts/ci/fresh-db/acceptance_168_current_tenant_cancel_contract.sql \
            | tee /tmp/voucher-atomic-168.out
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      # Keep the original Migration 168 race proof alive on the historical
      # transition it was written to test. Running it on the latest baseline is
      # invalid because later migrations (169/174+) deliberately changed the
      # direct-write and sensitive-permission contracts used by its fixtures.
      - name: Rebuild historical cutoff 152 through migration 168
        shell: bash
        run: |
          set -Eeuo pipefail
          HIST_BASELINE=sql/baseline/000_schema_baseline_20260729_210941.sql
          HIST_REFERENCE=sql/baseline/001_system_reference_data_20260729_210941.sql

          test -f "$HIST_BASELINE"
          test -f "$HIST_REFERENCE"

          createdb wardah_168_historical
          psql -v ON_ERROR_STOP=1 -d wardah_168_historical \
            -f scripts/ci/fresh-db/supabase_shim.sql -q
          psql -v ON_ERROR_STOP=1 -d wardah_168_historical -f "$HIST_BASELINE" -q
          psql -v ON_ERROR_STOP=1 -d wardah_168_historical -f "$HIST_REFERENCE" -q

          python3 scripts/ci/fresh-db/build_apply_order.py sql/migrations 152 \
            | awk -F_ '$1 + 0 <= 168 { print }' \
            > /tmp/chain_order_168_historical.txt

          test -s /tmp/chain_order_168_historical.txt
          tail -1 /tmp/chain_order_168_historical.txt \
            | grep -q '^168_voucher_atomic_lifecycle_rpcs.sql$'

          REPORT=/tmp/chain_report_168_historical.txt \
            PGDATABASE=wardah_168_historical \
            bash scripts/ci/fresh-db/run_chain.sh \
              sql/migrations /tmp/chain_order_168_historical.txt
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Re-run original Migration 168 acceptance and concurrency proof
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -v ON_ERROR_STOP=1 -d wardah_168_historical \
            -f scripts/ci/fresh-db/acceptance_168_voucher_atomic_lifecycle.sql \
            | tee /tmp/voucher-atomic-168-historical.out

          PGDATABASE=wardah_168_historical \
            bash scripts/ci/fresh-db/acceptance_168_concurrency.sh \
            | tee -a /tmp/voucher-atomic-168-historical.out
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Verify acceptance markers
        run: |
          set -Eeuo pipefail
          grep -q 'VOUCHER_ATOMIC_168_CURRENT_TENANT_CANCEL_CONTRACT_PASS' \
            /tmp/voucher-atomic-168.out
          grep -q 'VOUCHER_ATOMIC_168_ACCEPTANCE_PASS' \
            /tmp/voucher-atomic-168-historical.out
          grep -q 'VOUCHER_ATOMIC_168_CONCURRENCY_PASS' \
            /tmp/voucher-atomic-168-historical.out

      - name: Upload atomic lifecycle acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voucher-atomic-168-${{ github.run_id }}
          path: |
            /tmp/voucher-atomic-168.out
            /tmp/voucher-atomic-168-historical.out
            /tmp/chain_order.txt
            /tmp/chain_report.txt
            /tmp/chain_order_168_historical.txt
            /tmp/chain_report_168_historical.txt
            /tmp/v168-cancel-a.out
            /tmp/v168-cancel-b.out
            /tmp/v168-edit-a.out
            /tmp/v168-edit-b.out
          if-no-files-found: error
          retention-days: 30
