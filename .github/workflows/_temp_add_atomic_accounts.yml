name: Temporary Add Atomic Voucher Accounts

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/payment-vouchers-legal-gl-contract' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-vouchers-legal-gl-contract
      - name: Add AR and AP fixture accounts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/fresh-db/setup_153_pre_migration_fixture.sql')
          text = path.read_text()
          old = """  ('53a00000-0000-0000-0000-000000000004', '53222222-2222-2222-2222-222222222222',
   '410100', 'Revenue B', 'Revenue B', 'إيراد ب', 'REVENUE', 'REVENUE', 'CREDIT', true, true);"""
          new = """  ('53a00000-0000-0000-0000-000000000004', '53222222-2222-2222-2222-222222222222',
   '410100', 'Revenue B', 'Revenue B', 'إيراد ب', 'REVENUE', 'REVENUE', 'CREDIT', true, true),
  ('53a00000-0000-0000-0000-000000000005', '53111111-1111-1111-1111-111111111111',
   '112000', 'AR A', 'AR A', 'ذمم مدينة أ', 'ASSET', 'ACCOUNTS_RECEIVABLE', 'DEBIT', true, true),
  ('53a00000-0000-0000-0000-000000000006', '53111111-1111-1111-1111-111111111111',
   '211000', 'AP A', 'AP A', 'ذمم دائنة أ', 'LIABILITY', 'ACCOUNTS_PAYABLE', 'CREDIT', true, true),
  ('53a00000-0000-0000-0000-000000000007', '53222222-2222-2222-2222-222222222222',
   '112000', 'AR B', 'AR B', 'ذمم مدينة ب', 'ASSET', 'ACCOUNTS_RECEIVABLE', 'DEBIT', true, true),
  ('53a00000-0000-0000-0000-000000000008', '53222222-2222-2222-2222-222222222222',
   '211000', 'AP B', 'AP B', 'ذمم دائنة ب', 'LIABILITY', 'ACCOUNTS_PAYABLE', 'CREDIT', true, true);"""
          assert old in text, 'account fixture anchor missing'
          assert 'ACCOUNTS_RECEIVABLE' not in text, 'AR/AP accounts already present'
          path.write_text(text.replace(old, new))
          Path('.github/workflows/_temp_add_atomic_accounts.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(finance): add AR and AP atomic voucher accounts"
          git push origin HEAD:fix/payment-vouchers-legal-gl-contract
