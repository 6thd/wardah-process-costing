name: Posted material history M193 disposable acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'sql/migrations/193_posted_material_history_delete_guard.sql'
      - 'docs/db/posted-history-193/**'
      - '.github/workflows/posted-material-history-193-acceptance.yml'
      - 'sql/baseline/**'
  workflow_dispatch:

jobs:
  acceptance:
    name: M193 RED and GREEN on disposable PG17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client for concurrency tests
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Prove RED on 192 and GREEN on 193
        run: bash docs/db/posted-history-193/run_local.sh
